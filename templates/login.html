<!DOCTYPE html>

<html>

<head>

<title>Login</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/base.css') }}">

<link rel="stylesheet"
href="{{ url_for('static', filename='css/auth.css') }}">

</head>

<body>

<div class="overlay"></div>

<form
class="login-box"
method="POST">

<h1>⚔ Login</h1>

<div class="input-group">

<input
type="email"
name="email"
placeholder="Email"
required>

</div>

<div class="input-group">

<input
type="password"
name="password"
placeholder="Password"
required>

</div>

<button
class="login-btn">

Login

</button>

<div class="bottom">

Don't have an account?

<a href="/register">

Register

</a>

</div>

</form>

</body>

</html>
