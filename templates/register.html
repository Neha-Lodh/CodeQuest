<!DOCTYPE html>

<html>

<head>

<title>Register</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/base.css') }}">

<link rel="stylesheet"
href="{{ url_for('static', filename='css/auth.css') }}">

</head>

<body>

<div class="overlay"></div>

<form
class="login-box"
method="POST">

<h1>🛡 Create Account</h1>

<div class="input-group">

<input
type="text"
name="username"
placeholder="Username"
required>

</div>

<div class="input-group">

<input
type="email"
name="email"
placeholder="Email"
required>

</div>

<div class="input-group">

<input
type="password"
name="password"
placeholder="Password"
required>

</div>

<button
class="login-btn">

Start Adventure

</button>

<div class="bottom">

Already have an account?

<a href="/login">

Login

</a>

</div>

</form>

</body>

</html>
